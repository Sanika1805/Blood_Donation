<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Successful | Blood Donation App</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gradient-to-br from-red-100 via-white to-red-50 min-h-screen flex flex-col items-center justify-center">
  <div class="bg-white rounded-xl shadow-2xl p-10 max-w-lg w-full flex flex-col items-center">
    <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-4 animate-bounce"></i>
    <h1 class="text-3xl font-bold text-red-700 mb-2 text-center">Registration Successful!</h1>
    <p class="text-lg text-gray-700 mb-6 text-center">Thank you for registering as a blood donor. You are now part of a lifesaving community!</p>
    <div class="flex flex-col gap-4 w-full">
      <a href="/index.html#find-donors" class="bg-gradient-to-r from-red-600 to-red-400 hover:from-red-700 hover:to-red-500 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition text-center flex items-center justify-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> Find Donors</a>
      <a href="/index.html#home" class="bg-white border-2 border-red-600 text-red-600 hover:bg-red-50 font-semibold py-3 px-6 rounded-lg shadow-lg transition text-center flex items-center justify-center gap-2"><i class="fa-solid fa-house"></i> Go to Home</a>
      <a href="/index.html#register" class="bg-white border-2 border-green-600 text-green-600 hover:bg-green-50 font-semibold py-3 px-6 rounded-lg shadow-lg transition text-center flex items-center justify-center gap-2"><i class="fa-solid fa-user-plus"></i> Register Another Donor</a>
      <a href="mailto:?subject=Blood%20Donation%20App&body=I%20just%20registered%20as%20a%20blood%20donor!%20Join%20me%20at%20our%20community%20site." class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition text-center flex items-center justify-center gap-2"><i class="fa-solid fa-share-nodes"></i> Share with Friends</a>
    </div>
    <div class="mt-8 text-gray-500 text-sm text-center">
      <p>Want to help more? <a href="https://www.redcrossblood.org/" target="_blank" class="text-red-600 underline hover:text-red-800">Learn about blood donation</a></p>
    </div>
  </div>

</html>
